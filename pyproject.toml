[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formdiscovery"
version = "0.0.1"
description = "Python translation of formdiscovery1.0 (Kemp & Tenenbaum 2008), verified against the original MATLAB code in GNU Octave"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.3",
    "matplotlib>=3.8",
    "threadpoolctl>=3",
]

[project.scripts]
formdiscovery = "formdiscovery.cli:main"

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6", "pytest-xdist>=3", "pytest-qt>=4.4"]
# legacy (loop0004 item 04): only for the live Octave oracle under legacy/; Octave itself
# comes from legacy/environment-octave.yml. Removed with legacy/ (PLAN_LEGACY.md Phase 5).
octave = ["oct2py>=5.6"]
graphviz = ["pygraphviz>=1.11"]
gui = ["PySide6>=6.6"]
interactive = ["plotly>=5.18", "pyvis>=0.3.2"]
notebook = ["plotly>=5.18", "pyvis>=0.3.2", "jupyter", "nbformat>=5", "nbclient>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
# legacy/tests: collected only when legacy/ exists (a glob that matches nothing is
# dropped; legacy/tests/conftest.py, loop0004 item 03)
testpaths = ["tests", "legacy/tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
# pytest-qt (loop0003): the fd env also has PyQt5; the GUI is PySide6
qt_api = "pyside6"
markers = [
    "slow: long-running tests (large synthetic/real data sets); excluded from the regression gate",
    "octave: live parity tests that run the original MATLAB code through Octave (oct2py); skipped when Octave is unavailable, a failure in strict mode (fd env or RALPH_REQUIRE_OCTAVE=1)",
]

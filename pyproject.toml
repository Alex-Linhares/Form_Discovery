[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formdiscovery"
version = "0.0.1"
description = "Python translation of formdiscovery1.0 (Kemp & Tenenbaum 2008), verified against the original MATLAB code in GNU Octave"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
octave = ["oct2py>=5.6"]
graphviz = ["pygraphviz>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "slow: long-running tests (large synthetic/real data sets); excluded from the regression gate",
    "octave: live parity tests that run the original MATLAB code through Octave (oct2py); skipped when Octave is unavailable",
]

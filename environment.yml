# Conda environment for the formdiscovery translation.
# Create with:  conda env create -f environment.yml   (env name: fd)
# Versions pinned in iteration 02 (2026-09-28) from the built env.
# Octave works without activating the env: tests/conftest.py sets OCTAVE_EXECUTABLE and
# OCTAVE_HOME (conda-forge Octave needs OCTAVE_HOME=<env prefix>, normally set by activate).
name: fd
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - numpy=2.5.3
  - scipy=1.18.1
  - networkx=3.7
  - matplotlib=3.11.2
  - pytest=9.1.1
  - pytest-xdist=3.8.0  # loop0002 item 05: parallel gate (-n 16, one Octave per worker)
  - hypothesis=6.168.3
  - octave=10.3.0
  - oct2py=6.1.1
  - pygraphviz=2.0.2
  - graphviz=14.1.2
  - threadpoolctl=3.7.0  # item 35: BLAS thread limit (formdiscovery.threads)
  - pyside6=6.10.1  # loop0003: the GUI (extra "gui")
  - pytest-qt=4.5.0  # loop0003 item 01: offscreen GUI tests
  - pip=26.2.1
  - pip:
      # item 34: optional interactive display backends (extra "interactive")
      - plotly==5.24.1
      - pyvis==0.3.2

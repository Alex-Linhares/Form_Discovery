# Conda environment for the formdiscovery port (Python only).
# Create with:  conda env create -f environment.yml   (env name: fd)
# Versions pinned in iteration 02 (2026-09-28) from the built env.
# Octave and oct2py are not here (loop0004 item 04): the live Octave oracle under legacy/
# needs them, and legacy/environment-octave.yml adds them to this env:
#   conda env update -f legacy/environment-octave.yml
# Without them, run the fixture-only gate: pytest -q -m "not slow and not octave" -n 16
# (in an env named fd, strict mode is on by default and a skipped octave test fails;
# RALPH_REQUIRE_OCTAVE=0 turns that off, tests/conftest.py).
name: fd
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - numpy=2.5.3
  - scipy=1.18.1
  - networkx=3.7
  - matplotlib=3.11.2
  - pytest=9.1.1
  - pytest-xdist=3.8.0  # loop0002 item 05: parallel gate (-n 16)
  - hypothesis=6.168.3
  - pygraphviz=2.0.2
  - graphviz=14.1.2
  - threadpoolctl=3.7.0  # item 35: BLAS thread limit (formdiscovery.threads)
  - pyside6=6.10.1  # loop0003: the GUI (extra "gui")
  - pytest-qt=4.5.0  # loop0003 item 01: offscreen GUI tests
  - pip=26.2.1
  - pip:
      # item 34: optional interactive display backends (extra "interactive")
      - plotly==5.24.1
      - pyvis==0.3.2
